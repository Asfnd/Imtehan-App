<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Imtehan — Stories 9:16 (app-accurate · minimal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@9..40,400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f1f5f9;
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 1080 × 1920 */
    .canvas {
      width: 1080px;
      height: 1920px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 40px 28px;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 50% at 50% 20%, rgba(99, 102, 241, 0.06), transparent 60%);
      pointer-events: none;
    }

    /* Device — shows app UI 1:1 structure */
    .phone {
      position: relative;
      z-index: 1;
      width: 440px;
      padding: 12px;
      border-radius: 48px;
      background: linear-gradient(160deg, #3f3f46, #0f0f10);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 40px 100px rgba(15, 23, 42, 0.28);
    }

    .notch {
      height: 26px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 4px;
    }

    .notch i {
      width: 104px;
      height: 22px;
      background: #09090b;
      border-radius: 0 0 14px 14px;
      display: block;
    }

    .screen {
      border-radius: 36px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      max-height: 1580px;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    }

    /* === QuizGamificationHeader (matches app row) === */
    .qh {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 12px 12px 8px;
      background: #fff;
    }

    @media (min-width: 0) {
      .qh { gap: 10px; padding: 14px 14px 14px 10px; }
    }

    .qh-x {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      margin-left: -4px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #94a3b8;
      font-size: 22px;
      line-height: 1;
      cursor: default;
    }

    .qh-label {
      flex-shrink: 0;
      padding-top: 2px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }

    .qh-bar {
      flex: 1;
      min-width: 0;
    }

    .qh-track {
      position: relative;
      height: 14px;
      width: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(241, 245, 249, 0.9);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(226, 232, 240, 0.7);
    }

    .qh-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(to right, #6366f1, #8b5cf6, #4f46e5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transform-origin: left center;
      transform: scaleX(0.42);
    }

    .qh-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.28), transparent);
      pointer-events: none;
    }

    .qh-pills {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qh-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .qh-pill.fire {
      border: 1px solid #ffedd5;
      background: #fff7ed;
      color: #ea580c;
    }

    .qh-pill.xp {
      border: 1px solid #e0e7ff;
      background: #eef2ff;
      color: #4f46e5;
    }

    .qh-pill svg {
      width: 20px;
      height: 20px;
    }

    /* Main quiz column (matches page.tsx main) */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 16px 16px;
      overflow: hidden;
    }

    .level {
      flex-shrink: 0;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6366f1;
    }

    .level span {
      margin-right: 2px;
    }

    .question {
      flex-shrink: 0;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: #1e293b;
      text-wrap: pretty;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* btn-3d + flow option (AnswerOption) */
    .opt {
      display: flex;
      min-height: 48px;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      background: #fff;
      box-shadow: 0 4px 0 0 #e5e7eb;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      cursor: default;
    }

    .opt .badge {
      flex-shrink: 0;
      display: flex;
      height: 32px;
      width: 32px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      font-size: 13px;
      color: #94a3b8;
    }

    .opt.sel {
      border-color: #6366f1;
      background: #eef2ff;
      color: #1e1b4b;
      box-shadow: 0 4px 0 0 #818cf8;
    }

    .opt.sel .badge {
      border-color: #a5b4fc;
      color: #4f46e5;
      background: #eef2ff;
    }

    .opt.dim {
      opacity: 0.55;
    }

    /* Journey panel strip — compact */
    .rail {
      flex-shrink: 0;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
    }

    .rail h3 {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #312e81;
      margin-bottom: 8px;
    }

    .rail-svg {
      width: 100%;
      height: 72px;
    }

    .home-bar {
      height: 4px;
      width: 112px;
      background: #18181b;
      border-radius: 3px;
      margin: 12px auto 0;
      opacity: 0.22;
    }

    .footer-min {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="phone">
      <div class="notch"><i></i></div>
      <div class="screen">
        <header class="qh" aria-label="Quiz header">
          <button type="button" class="qh-x" aria-hidden="true">×</button>
          <span class="qh-label">8 / 20</span>
          <div class="qh-bar">
            <div class="qh-track"><div class="qh-fill"></div></div>
          </div>
          <div class="qh-pills">
            <div class="qh-pill fire">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              <span>3</span>
            </div>
            <div class="qh-pill xp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span>420</span>
            </div>
          </div>
        </header>

        <div class="main">
          <div class="level"><span aria-hidden="true">★</span> LEVEL 12</div>
          <p class="question">The committee reached a ______ decision — everyone agreed.</p>
          <div class="opts">
            <div class="opt dim">
              <span class="badge">A</span>
              <span>unilateral</span>
            </div>
            <div class="opt sel">
              <span class="badge">B</span>
              <span>unanimous</span>
            </div>
            <div class="opt dim">
              <span class="badge">C</span>
              <span>ambiguous</span>
            </div>
            <div class="opt dim">
              <span class="badge">D</span>
              <span>tentative</span>
            </div>
          </div>

          <aside class="rail">
            <h3>YOUR JOURNEY</h3>
            <svg class="rail-svg" viewBox="0 0 320 72" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path d="M20 56 Q90 12 160 28 Q230 44 300 24" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="4 4" />
              <path d="M20 56 Q90 12 160 28 Q230 44 300 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="46" />
              <circle cx="52" cy="40" r="6" fill="#34d399" stroke="#fff" stroke-width="2" />
              <circle cx="160" cy="26" r="6" fill="#34d399" stroke="#fff" stroke-width="2" />
              <circle cx="268" cy="30" r="6" fill="#cbd5e1" stroke="#fff" stroke-width="2" />
              <g transform="translate(118, 8)">
                <circle cx="18" cy="18" r="16" fill="#fff" stroke="#6366f1" stroke-width="2" />
                <text x="18" y="23" text-anchor="middle" font-size="18">🦉</text>
              </g>
            </svg>
          </aside>
        </div>
      </div>
      <div class="home-bar" aria-hidden="true"></div>
    </div>

    <p class="footer-min">imtehan.com</p>
  </div>
</body>
</html>
